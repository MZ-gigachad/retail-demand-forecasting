project:
  name: retail-demand-forecasting
  author: Md Hussain
  version: 0.1.0
  seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  external: data/external
  models: models
  reports: reports
  figures: reports/figures

data:
  date_col: Date
  store_col: Store_ID
  product_col: Product_ID
  target_col: Units_Sold
  frequency: D

split:
  train_end: null
  val_end: null
  test_days: 60

forecast:
  horizons: [7, 14, 30]
  default_horizon: 30
  strategy: direct

features:
  lags: [1, 7, 14, 28]
  rolling_windows: [7, 14, 28]
  target_encoding_cols: ["Store_ID", "Category"]

models:
  prophet:
    growth: linear
    yearly_seasonality: true
    weekly_seasonality: true
    daily_seasonality: false
  lstm:
    lookback_window: 30
    batch_size: 64
    epochs: 50
    learning_rate: 0.001
  catboost:
    iterations: 1000
    learning_rate: 0.05
    depth: 6
    loss_function: RMSE

inventory:
  service_level: 0.95
  lead_time_days: 7
  holding_cost_rate: 0.20
  stockout_penalty_multiplier: 1.5
